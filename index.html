<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南方国际看板</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#fff; --ink:#16233b; --muted:#6b7a90;
    --line:#e3e9f2; --navy:#12315c; --accent:#2f6fd0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .topbar{
    background:linear-gradient(135deg,#0f2c54 0%,#1b4b8f 100%);color:#fff;
    padding:12px 20px 10px;flex:none;
  }
  .wrap{max-width:1600px;width:100%;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{
    width:38px;height:38px;border-radius:10px;flex:none;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;
  }
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.5px}
  .subtitle{margin:2px 0 0;font-size:11.5px;color:#c9daf3}
  .meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);color:#eaf2ff}
  .chip b{color:#fff}

  .groupbar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
    padding:0 12px;display:flex;gap:8px;overflow-x:auto}
  .group{
    flex:0 0 auto;cursor:pointer;user-select:none;border:none;background:transparent;font:inherit;
    font-size:14px;font-weight:700;color:var(--muted);padding:11px 18px;white-space:nowrap;
    border-bottom:3px solid transparent;transition:.15s;
  }
  .group small{font-size:10.5px;font-weight:500;color:#9aa8bc;margin-left:7px}
  .group:hover{color:var(--ink);background:#f7f9fc}
  .group.active{color:var(--accent);border-bottom-color:var(--accent)}
  .group.active small{color:#7b93b8}

  .tabbar{flex:none;background:#f8fafc;border-bottom:1px solid var(--line);
    padding:0 12px;display:flex;gap:6px;overflow-x:auto}
  .tab{
    flex:0 0 auto;cursor:pointer;user-select:none;border:1px solid transparent;background:transparent;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
    padding:8px 14px;margin:6px 0;border-radius:999px;white-space:nowrap;transition:.15s;
  }
  .tab small{font-size:10px;font-weight:400;color:#9aa8bc;margin-left:6px}
  .tab:hover{color:var(--ink);background:#eef3fa}
  .tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  .tab.active small{color:#dce8ff}
  .tab.ext small{color:#b07a1e}
  .tab.active.ext small{color:#ffe9b8}

  .stage{flex:1;position:relative;min-height:0}
  .pane{display:none;position:absolute;inset:0;background:#fff}
  .pane.active{display:block}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;background:#fff;z-index:1}
  .pane.loaded .loader{display:none}

  @media(max-width:700px){
    .meta{display:none}
    h1{font-size:16px}
    .group{padding:9px 12px;font-size:13px}
    .tab{padding:6px 11px;font-size:11.5px}
    .tab small{display:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="logo">南</div>
      <div>
        <h1>南方国际看板</h1>
        <p class="subtitle">投资策略 · 研究共享 · 定期观点 ｜ 原始看板原样呈现，同类文件默认取最新日期</p>
      </div>
      <div class="meta">
        <span class="chip">来源 · <b>资料库 / 南方国际看板源文件</b></span>
        <span class="chip">看板 · <b>10</b></span>

    </div>
  </div>
</div>

<div class="groupbar" role="tablist">

  <button class="tab" data-group="strategy" data-target="t3" role="tab">费城半导体主线<small>2026-08-11</small></button>
  <button class="tab" data-group="strategy" data-target="t4" role="tab">汇丰渣打</button>
  <button class="tab ext" data-group="strategy" data-target="t5" role="tab">地产高频数据<small>外链</small></button>

  <div class="pane" id="t7" role="tabpanel"><div class="loader">加载看板…</div><iframe data-src="boards/cross_border_etf_daily.html" title="南方跨境ETF日报"></iframe></div>

<script>
(function(){
  var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panes = Array.prototype.slice.call(document.querySelectorAll('.pane'));
  var currentGroup = null;

  function load(pane){
    var f = pane.querySelector('iframe');
    if(f && !f.src && f.dataset.src){
      f.src = f.dataset.src;
      f.onload = function(){ pane.classList.add('loaded'); };
    }
  }
  function activateTab(id, hash){
    var t = document.getElementById(id);
    if(!t) return;
    tabs.forEach(function(x){ x.classList.toggle('active', x.dataset.target === id); });
    panes.forEach(function(p){ p.classList.toggle('active', p === t); });
    load(t);
    if(hash && history.replaceState) history.replaceState(null,'','#'+id);
  }
  function activateGroup(key, hash){
    var g = groups.filter(function(x){ return x.dataset.group === key; })[0];
    if(!g) return;
    currentGroup = key;
    groups.forEach(function(x){ x.classList.toggle('active', x === g); });
    tabs.forEach(function(x){ x.style.display = x.dataset.group === key ? '' : 'none'; });
    var visible = tabs.filter(function(x){ return x.dataset.group === key; });
    if(visible.length){
      var active = visible.filter(function(x){ return x.classList.contains('active'); })[0] || visible[0];
      activateTab(active.dataset.target, hash);
    }
  }
  groups.forEach(function(x){
    x.addEventListener('click', function(){ activateGroup(x.dataset.group, true); });
  });
  tabs.forEach(function(x){
    x.addEventListener('click', function(){ activateTab(x.dataset.target, true); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    var visible = tabs.filter(function(x){ return x.style.display !== 'none'; });
    var i = visible.findIndex(function(x){ return x.classList.contains('active'); });
    if(i<0) return;
    var n = e.key==='ArrowRight' ? (i+1)%visible.length : (i-1+visible.length)%visible.length;
    activateTab(visible[n].dataset.target, true);
  });

  var h = (location.hash||'').replace('#','');
  var target = document.getElementById(h);
  if(target){
    var pane = target;
    var tab = tabs.filter(function(x){ return x.dataset.target === h; })[0];
    activateGroup(tab ? tab.dataset.group : groups[0].dataset.group, false);
    activateTab(h, false);
  }else{
    activateGroup(groups[0].dataset.group, false);
  }
})();
</script>
